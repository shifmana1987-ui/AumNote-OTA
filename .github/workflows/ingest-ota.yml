name: Ingest OTA Candidate

on:
  push:
    branches: [main]
    paths:
      - ingest/request.json

permissions:
  contents: write

concurrency:
  group: aumnote-ota-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout OTA distribution repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read request
        id: request
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, os
          request = json.loads(pathlib.Path("ingest/request.json").read_text(encoding="utf-8"))
          url = request.get("artifactUrl", "")
          expected_family = int(request.get("nativeVersionCode", 0))
          if not url.startswith("https://"):
              raise SystemExit("artifactUrl must be https")
          if expected_family != 450:
              raise SystemExit("only native family 450 is accepted")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"url={url}\n")
          PY

      - name: Download private-build handoff
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.request.outputs.url }}
        run: |
          curl --fail --location --retry 3 --output /tmp/aumnote-ota-artifact.zip "$ARTIFACT_URL"
          rm -rf /tmp/aumnote-ota
          mkdir -p /tmp/aumnote-ota
          unzip -q /tmp/aumnote-ota-artifact.zip -d /tmp/aumnote-ota
          find /tmp/aumnote-ota -maxdepth 2 -type f -print

      - name: Verify and publish bundle
        shell: bash
        run: |
          python - <<'PY'
          import datetime, hashlib, json, pathlib, shutil

          stage = pathlib.Path("/tmp/aumnote-ota")
          manifest_path = stage / "latest.candidate.json"
          if not manifest_path.exists():
              raise SystemExit("latest.candidate.json missing")

          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("schema") != 1:
              raise SystemExit("unsupported manifest schema")
          if manifest.get("enabled") is not True:
              raise SystemExit("candidate manifest must be enabled")
          if manifest.get("channel") != "owner":
              raise SystemExit("candidate channel must be owner")
          if manifest.get("nativeVersionCode") != 450:
              raise SystemExit("candidate native family mismatch")

          version = str(manifest.get("version", ""))
          parts = version.split(".")
          if len(parts) != 3 or parts[0] != "450" or not all(p.isdigit() for p in parts):
              raise SystemExit("invalid OTA version")

          expected_url = f"https://raw.githubusercontent.com/shifmana1987-ui/AumNote-OTA/main/bundles/{version}.zip"
          if manifest.get("url") != expected_url:
              raise SystemExit("candidate URL mismatch")

          bundle = stage / f"AumNote_OTA_{version}.zip"
          if not bundle.exists():
              raise SystemExit("candidate bundle missing")

          digest = hashlib.sha256(bundle.read_bytes()).hexdigest()
          if digest.lower() != str(manifest.get("checksum", "")).lower():
              raise SystemExit("SHA-256 mismatch")

          bundles = pathlib.Path("bundles")
          bundles.mkdir(parents=True, exist_ok=True)
          destination = bundles / f"{version}.zip"
          shutil.copy2(bundle, destination)

          manifest["publishedAt"] = datetime.datetime.now(datetime.timezone.utc).isoformat()
          pathlib.Path("latest.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )
          pathlib.Path("ingest/status.json").write_text(
              json.dumps({
                  "status": "published",
                  "version": version,
                  "nativeVersionCode": 450,
                  "checksum": digest,
                  "publishedAt": manifest["publishedAt"],
              }, indent=2) + "\n",
              encoding="utf-8",
          )
          pathlib.Path("/tmp/aumnote-ota-version.txt").write_text(version, encoding="utf-8")
          PY

      - name: Commit published OTA
        shell: bash
        run: |
          VERSION="$(cat /tmp/aumnote-ota-version.txt)"
          git config user.name "AumNote OTA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add "bundles/$VERSION.zip" latest.json ingest/status.json
          if git diff --cached --quiet; then
            echo "Bundle already published"
            exit 0
          fi
          git commit -m "ota: publish $VERSION"
          git push
